name: Release

# Automatic release, gated on a version tag. When you're ready to release:
#   git tag v1.0.0 && git push origin v1.0.0
# The action then tests, builds the extension, and publishes a GitHub Release
# with the packaged .zip attached. The tag must match `version` in package.json.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify tag matches package.json version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          echo "Tag version:  $TAG_VERSION"
          echo "package.json: $PKG_VERSION"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $PKG_VERSION"
            exit 1
          fi

      - name: Test
        run: npm test

      - name: Build extension
        run: npm run build

      - name: Read release notes from changelog
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          const tag = process.env.GITHUB_REF_NAME;
          const version = tag.slice(1);
          const changelog = readFileSync('CHANGELOG.md', 'utf8');
          const section = changelog.split(/^## /m).find(block => block.startsWith(`[${version}] - `));
          if (!section) throw new Error(`Missing changelog entry for ${tag}`);
          const notes = section.slice(section.indexOf('\n') + 1).trim();
          const link = `https://github.com/${process.env.GITHUB_REPOSITORY}/blob/${tag}/CHANGELOG.md`;
          writeFileSync('release-notes.md', `${notes}\n\n[Full changelog](${link})\n`);
          NODE

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: GitHub HTML Preview ${{ github.ref_name }}
          body_path: release-notes.md
          files: release/crx-github-html-preview-*.zip
